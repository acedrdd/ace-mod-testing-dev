name: Build Ace Cull

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fetch preloader SDK
        run: git clone --recurse-submodules --depth 1 https://github.com/LiteLDev/preloader-android preloader-android

      - name: Check NDK
        run: |
          echo "NDK: $ANDROID_NDK_HOME"
          test -f "$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake"

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DPRELOADER_ANDROID_ROOT="$PWD/preloader-android"

      - name: Build
        run: cmake --build build --target ace_cull -j4

      - name: Package .levipack
        run: |
          test -f build/out/libace_cull.so
          mkdir -p pack
          cp build/out/libace_cull.so pack/
          cp manifest.json pack/
          (cd pack && zip -r ../AceCull-1.26.60.levipack .)
          unzip -l AceCull-1.26.60.levipack
          file build/out/libace_cull.so

      - uses: actions/upload-artifact@v4
        with:
          name: AceCull-1.26.60
          path: AceCull-1.26.60.levipack
          if-no-files-found: error
